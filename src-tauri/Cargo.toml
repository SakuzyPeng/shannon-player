[package]
name = "shannon-player"
version = "0.1.0"
description = "香农播放器 — Shannon Player, an AGPL Rust desktop music player"
authors = ["Sakuzy Peng"]
license = "AGPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shannon_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# protocol-asset：封面缩略图经 asset:// 协议加载（scope 见 tauri.conf.json）。
tauri = { version = "2.9.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
shannon-core = { path = "../core" }
shannon-audio = { path = "../audio" }
