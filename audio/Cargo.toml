[package]
name = "shannon-audio"
version = "0.1.0"
description = "香农播放器音频引擎：解码、PCM 管线、输出后端。不依赖 Tauri / GUI。"
license = "AGPL-3.0-only"
edition = "2021"
# 1.89 而非其余 crate 的 1.85：`symphonia-adapter-libopus` 的 MSRV 就是 1.89。
# 写实际值而不是留着 1.85——声明比依赖低，等于给出一个编译不过的承诺。
rust-version = "1.89"

[[example]]
name = "bench_decode"
# 这份诊断工具有自己的状态映射逻辑，纳入常规测试，避免重构正式模块后留下失效测试。
test = true

[dependencies]
symphonia = { version = "0.6.0", features = ["mp3", "isomp4", "alac", "aac", "aiff", "caf"] }
# Opus 解码（`decode::codecs`）。Symphonia 0.6 覆盖 ogg / mkv **容器**却没有 opus
# **编码**，正是架构约束设想的「以自定义 Decoder 注册进 CodecRegistry」那类缺口。
# default feature `bundled` 会随包编译 libopus 的 C 源码：换来的是不依赖用户机器上
# 装没装 libopus，代价是构建需要 C 编译器，且本 crate 的 MSRV 被它抬到 1.89。
symphonia-adapter-libopus = "0.3.0"
cpal = "0.18.1"
rubato = "4.0.0"
# 前端契约（`contract.rs`）。serde 与 ts-rs 都不是 GUI 依赖，
# 因此「零 Tauri 依赖、可无头测试」的约束不受影响。
serde = { version = "1.0", features = ["derive"] }
# 响度分析结果落盘（`loudness::store`）。
serde_json = "1.0"
ts-rs = { version = "10.1.0", features = ["no-serde-warnings"] }
# 响度测量（`loudness.rs`）。**锁定版本**：换版本可能改变真峰值结果，
# 而结果是要长期缓存的——见 `loudness::ANALYSIS_VERSION`。
ebur128 = { version = "=0.1.10", features = ["precision-true-peak"] }

# 后台分析 worker 的 QoS 降级（`loudness::qos`）。三平台各一套原生调用，
# 拿不到低优先级只是降级为普通线程，不影响正确性。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
# CPAL 0.18.1 对 `windows` / `windows-core` 给了跨小版本的宽范围，Cargo 会分别选到
# 0.61 与 0.62，WASAPI 类型因而来自两套互不兼容的 `windows-core`。两者必须成对锁定；
# 等 CPAL 收紧上游约束后再移除这两行，并保留 Windows 目标编译检查防止回归。
windows = "=0.61.3"
windows-core = "=0.61.2"

[dev-dependencies]
# 诊断工具遍历真实曲库时禁止跟随符号链接，避免目录环无限递归。
walkdir = "2.5.0"
