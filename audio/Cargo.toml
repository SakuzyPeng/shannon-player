[package]
name = "shannon-audio"
version = "0.1.0"
description = "香农播放器音频引擎：解码、PCM 管线、输出后端。不依赖 Tauri / GUI。"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.85"

[dependencies]
symphonia = { version = "0.6.0", features = ["mp3", "isomp4", "alac", "aac", "aiff", "caf"] }
cpal = "0.18.1"
rubato = "4.0.0"
# 前端契约（`contract.rs`）。serde 与 ts-rs 都不是 GUI 依赖，
# 因此「零 Tauri 依赖、可无头测试」的约束不受影响。
serde = { version = "1.0", features = ["derive"] }
ts-rs = { version = "10.1.0", features = ["no-serde-warnings"] }

[dev-dependencies]
# `bench_decode --loudness` 必须跑与阶段 1 计划一致的完整负载，不能再以纯解码代替。
ebur128 = { version = "=0.1.10", features = ["precision-true-peak"] }
serde_json = "1.0"
# 诊断工具遍历真实曲库时禁止跟随符号链接，避免目录环无限递归。
walkdir = "2.5.0"
