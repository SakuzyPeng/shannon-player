[package]
name = "shannon-audio"
version = "0.1.0"
description = "香农播放器音频引擎：解码、PCM 管线、输出后端。不依赖 Tauri / GUI。"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.85"

[dependencies]
symphonia = { version = "0.6.0", features = ["mp3", "isomp4", "alac", "aac", "aiff", "caf"] }
cpal = "0.18.1"
rubato = "4.0.0"
